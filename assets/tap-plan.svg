<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"
     aria-labelledby="tapTitle tapDesc" width="1200" height="470">
<title id="tapTitle">Plan view of a lane-closure traffic accommodation plan</title>
<desc id="tapDesc">A two-lane one-way carriageway with the right lane closed. Reading in the
direction of travel: three advance-warning signs on the shoulder at the A spacing, an
electronic arrow board, a merging taper of cones over length L, a longitudinal buffer B,
the work area, and a downstream taper reopening the lane.</desc>

<defs>
  <pattern id="workHatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="14" height="14" fill="#3a2a1c"/>
    <rect width="6" height="14" fill="#E86A00" opacity="0.55"/>
  </pattern>
  <pattern id="bufferHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#2f3f54"/>
    <rect width="1.6" height="10" fill="#7d8ea3" opacity="0.7"/>
  </pattern>
  <marker id="dimArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L9 5 L0 9 z" fill="#9FB0C0"/>
  </marker>
  <marker id="dimArrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M10 1 L1 5 L10 9 z" fill="#9FB0C0"/>
  </marker>
  <g id="cone">
    <ellipse cx="0" cy="9" rx="7.5" ry="2.2" fill="#E86A00" stroke="#111" stroke-width="0.9"/>
    <path d="M0 -7 L5 8.4 H-5 z" fill="#E86A00" stroke="#111" stroke-width="1"/>
    <path d="M-2.3 0.6 h4.6 l0.75 2.6 h-6.1 z" fill="#fff"/>
  </g>
  <!-- Advance-warning sign: orange diamond on a post, plan-view marker style -->
  <g id="signPost">
    <rect x="-1.4" y="0" width="2.8" height="15" fill="#111"/>
  </g>
</defs>

<!-- ground / aerial tone -->
<rect width="1200" height="470" fill="#1d2a3c"/>
<g opacity="0.55">
  <rect x="0" y="0" width="1200" height="128" fill="#243449"/>
  <rect x="60" y="18" width="150" height="74" rx="3" fill="#2b3d54"/>
  <rect x="250" y="30" width="96" height="60" rx="3" fill="#293a50"/>
  <rect x="880" y="14" width="210" height="86" rx="3" fill="#2b3d54"/>
  <rect x="0" y="372" width="1200" height="98" fill="#243449"/>
  <rect x="120" y="392" width="180" height="60" rx="3" fill="#293a50"/>
  <rect x="700" y="388" width="260" height="66" rx="3" fill="#2b3d54"/>
</g>

<!-- shoulders -->
<rect x="0" y="140" width="1200" height="22" fill="#33445c"/>
<rect x="0" y="300" width="1200" height="26" fill="#33445c"/>

<!-- carriageway -->
<rect x="0" y="162" width="1200" height="138" fill="#414d5e"/>
<!-- edge lines -->
<rect x="0" y="164" width="1200" height="2.5" fill="#f0f3f7" opacity="0.85"/>
<rect x="0" y="295" width="1200" height="2.5" fill="#f0f3f7" opacity="0.85"/>
<!-- lane divider (dashed) -->
<line x1="0" y1="231" x2="1200" y2="231" stroke="#f0f3f7" stroke-width="2.5"
      stroke-dasharray="26 20" opacity="0.8"/>

<!-- direction of travel -->
<g>
  <line x1="40" y1="196" x2="150" y2="196" stroke="#6FCF8B" stroke-width="2.5" marker-end="url(#dimArrow)"/>
  <text x="40" y="186" fill="#6FCF8B" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600">TRAFFIC</text>
</g>

<!-- ============ work area + buffer in the closed (lower) lane ============ -->
<rect x="836" y="234" width="232" height="60" fill="url(#workHatch)"/>
<rect x="836" y="234" width="232" height="60" fill="none" stroke="#E86A00" stroke-width="1.6"/>
<text x="952" y="270" fill="#ffd7b0" font-family="Segoe UI,system-ui,sans-serif" font-size="14"
      font-weight="700" text-anchor="middle" letter-spacing="1.5">WORK AREA</text>

<rect x="762" y="234" width="74" height="60" fill="url(#bufferHatch)"/>
<rect x="762" y="234" width="74" height="60" fill="none" stroke="#7d8ea3" stroke-width="1.2" stroke-dasharray="4 3"/>

<!-- ============ merging taper ============ -->
<g>
  <use href="#cone" x="600" y="286"/>
  <use href="#cone" x="623" y="278"/>
  <use href="#cone" x="646" y="270"/>
  <use href="#cone" x="669" y="262"/>
  <use href="#cone" x="692" y="254"/>
  <use href="#cone" x="715" y="247"/>
  <use href="#cone" x="738" y="240"/>
  <use href="#cone" x="761" y="234"/>
</g>
<!-- tangent run along the closed lane line -->
<g>
  <use href="#cone" x="800" y="234"/>
  <use href="#cone" x="848" y="234"/>
  <use href="#cone" x="896" y="234"/>
  <use href="#cone" x="944" y="234"/>
  <use href="#cone" x="992" y="234"/>
  <use href="#cone" x="1040" y="234"/>
</g>
<!-- downstream taper reopening the lane -->
<g>
  <use href="#cone" x="1080" y="243"/>
  <use href="#cone" x="1110" y="257"/>
  <use href="#cone" x="1140" y="271"/>
  <use href="#cone" x="1170" y="285"/>
</g>

<!-- ============ electronic arrow board at the taper head ============ -->
<g transform="translate(548,258)">
  <rect x="-26" y="-16" width="52" height="27" rx="3" fill="#111" stroke="#5a6572" stroke-width="1.2"/>
  <g fill="#FFB300">
    <circle cx="-15" cy="-2.5" r="2.9"/><circle cx="-6" cy="-2.5" r="2.9"/>
    <circle cx="3" cy="-2.5" r="2.9"/><circle cx="12" cy="-2.5" r="3.3"/>
    <circle cx="6.5" cy="-9.5" r="2.9"/><circle cx="6.5" cy="4.5" r="2.9"/>
  </g>
  <path d="M-16 11 v6 M16 11 v6" stroke="#111" stroke-width="2.6"/>
  <circle cx="-16" cy="19" r="3.6" fill="#111"/><circle cx="16" cy="19" r="3.6" fill="#111"/>
  <text x="0" y="34" fill="#9FB0C0" font-family="Segoe UI,system-ui,sans-serif" font-size="11"
        text-anchor="middle">Electronic arrow board</text>
</g>

<!-- ============ advance-warning signs on the shoulder ============ -->
<!-- sign 1: construction ahead -->
<g transform="translate(96,336)">
  <use href="#signPost" x="0" y="0"/>
  <g transform="translate(0,-1) rotate(45)">
    <rect x="-16" y="-16" width="32" height="32" rx="2" fill="#E86A00" stroke="#111" stroke-width="2"/>
  </g>
  <g transform="rotate(-0)">
    <path d="M-6 4 l5.5 -11 h1.4 l5.6 11 z" fill="#111"/>
    <rect x="-8" y="4" width="16" height="2.6" fill="#111"/>
  </g>
  <text x="0" y="30" fill="#e7edf4" font-family="Segoe UI,system-ui,sans-serif" font-size="12"
        font-weight="600" text-anchor="middle">WD-101</text>
  <text x="0" y="45" fill="#9FB0C0" font-family="Segoe UI,system-ui,sans-serif" font-size="11"
        text-anchor="middle">Construction ahead</text>
</g>
<!-- sign 2: road work -->
<g transform="translate(300,336)">
  <use href="#signPost" x="0" y="0"/>
  <g transform="translate(0,-1) rotate(45)">
    <rect x="-16" y="-16" width="32" height="32" rx="2" fill="#E86A00" stroke="#111" stroke-width="2"/>
  </g>
  <g>
    <circle cx="-1" cy="-7.5" r="3" fill="#111"/>
    <path d="M-5 -3.5 h8 l2 9 h-12 z" fill="#111"/>
    <path d="M4 -6 L11 1 L9 3 L2 -4 z" fill="#111"/>
  </g>
  <text x="0" y="30" fill="#e7edf4" font-family="Segoe UI,system-ui,sans-serif" font-size="12"
        font-weight="600" text-anchor="middle">WD-A-41</text>
  <text x="0" y="45" fill="#9FB0C0" font-family="Segoe UI,system-ui,sans-serif" font-size="11"
        text-anchor="middle">Road work</text>
</g>
<!-- sign 3: right lane ends -->
<g transform="translate(504,336)">
  <use href="#signPost" x="0" y="0"/>
  <g transform="translate(0,-1) rotate(45)">
    <rect x="-16" y="-16" width="32" height="32" rx="2" fill="#E86A00" stroke="#111" stroke-width="2"/>
  </g>
  <g stroke="#111" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M-5 8 L-5 -8"/>
    <path d="M5.5 8 L5.5 1 C5.5 -4 1 -5 -1.5 -8"/>
  </g>
  <text x="0" y="30" fill="#e7edf4" font-family="Segoe UI,system-ui,sans-serif" font-size="12"
        font-weight="600" text-anchor="middle">WD-A-33-R</text>
  <text x="0" y="45" fill="#9FB0C0" font-family="Segoe UI,system-ui,sans-serif" font-size="11"
        text-anchor="middle">Road narrows, right lane ends</text>
</g>

<!-- ============ dimension lines ============ -->
<g font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#9FB0C0">
  <!-- A spacing between advance signs -->
  <line x1="98" y1="122" x2="298" y2="122" stroke="#9FB0C0" stroke-width="1.2"
        marker-start="url(#dimArrowStart)" marker-end="url(#dimArrow)"/>
  <text x="198" y="115" text-anchor="middle">A</text>
  <line x1="302" y1="122" x2="502" y2="122" stroke="#9FB0C0" stroke-width="1.2"
        marker-start="url(#dimArrowStart)" marker-end="url(#dimArrow)"/>
  <text x="402" y="115" text-anchor="middle">A</text>
  <!-- taper length L -->
  <line x1="600" y1="122" x2="762" y2="122" stroke="#E86A00" stroke-width="1.4"
        marker-start="url(#dimArrowStart)" marker-end="url(#dimArrow)"/>
  <text x="681" y="115" text-anchor="middle" fill="#ffbe7d" font-weight="600">L — taper</text>
  <!-- buffer B -->
  <line x1="763" y1="122" x2="835" y2="122" stroke="#9FB0C0" stroke-width="1.2"
        marker-start="url(#dimArrowStart)" marker-end="url(#dimArrow)"/>
  <text x="799" y="115" text-anchor="middle">B</text>
  <!-- work length -->
  <line x1="837" y1="122" x2="1067" y2="122" stroke="#9FB0C0" stroke-width="1.2"
        marker-start="url(#dimArrowStart)" marker-end="url(#dimArrow)"/>
  <text x="952" y="115" text-anchor="middle">Work length</text>
  <!-- tick marks down to the road -->
  <g stroke="#9FB0C0" stroke-width="0.9" opacity="0.5">
    <line x1="98" y1="126" x2="98" y2="320"/>
    <line x1="300" y1="126" x2="300" y2="320"/>
    <line x1="502" y1="126" x2="502" y2="320"/>
    <line x1="600" y1="126" x2="600" y2="290"/>
    <line x1="762" y1="126" x2="762" y2="232"/>
    <line x1="836" y1="126" x2="836" y2="232"/>
    <line x1="1068" y1="126" x2="1068" y2="232"/>
  </g>
</g>

<!-- north arrow -->
<g transform="translate(1128,66)">
  <circle cx="0" cy="0" r="24" fill="#1a283b" stroke="#5a6572" stroke-width="1.2" opacity="0.9"/>
  <path d="M0 -15 L7 8 L0 2.5 L-7 8 z" fill="#e7edf4"/>
  <text x="0" y="-18" fill="#9FB0C0" font-family="Segoe UI,system-ui,sans-serif" font-size="11"
        text-anchor="middle" font-weight="700">N</text>
</g>
</svg>
